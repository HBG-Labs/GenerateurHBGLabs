name: P3.2 Premium Motion Vocabulary Certification

on:
  push:
    branches:
      - feature/social-visual-director
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-premium-motion-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
    steps:
      - name: Checkout exact P3.2 ref
        uses: actions/checkout@v4

      - name: Report exact certification SHA
        run: git rev-parse HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Full offline P1/P2/P3.1/P3.2 quality gate
        run: npm run check

      - name: Offline P1.7 dynamic typography evidence
        run: npm run certify:p1.7

      - name: Real Linux P1.7 dynamic typography render
        run: npm run render:p1.7

      - name: Offline P3.1 evidence
        run: npm run certify:p3.1

      - name: Real Linux P3.1 reference reconstruction
        run: npm run render:p3.1

      - name: Offline P3.2 evidence
        run: npm run certify:p3.2

      - name: Real Linux P3.2 reference render
        run: npm run render:p3.2

      - name: Verify atomic reference package
        shell: bash
        run: |
          test -s out/p3.1/reference/p3-1-blue-sky.mp4
          test -s out/p3.1/reference/p2-science-baseline.mp4
          test -s out/p3.1/reference/p3-1-contact-sheet.png
          test -s out/p3.1/reference/p2-vs-p3-1-comparison-sheet.png
          test -s out/p3.1/reference/visual-plan.json
          test -s out/p3.1/reference/visual-preflight.json
          test -s out/p3.1/reference/visual-diversity-report.json
          test -s out/p3.1/reference/manifest.json
          test -s out/p3.1/reference/artifact-integrity.json
          test -s out/p1.7/reference/p1-7-dynamic-typography.mp4
          test -s out/p1.7/reference/p1-7-contact-sheet.png
          test -s out/p1.7/reference/render-plan.json
          test -s out/p1.7/reference/preflight.json
          test -s out/p1.7/reference/manifest.json
          test -s out/p1.7/reference/artifact-integrity.json
          test -s out/p3.2/reference/p3-2-blue-sky.mp4
          test -s out/p3.2/reference/p3-2-contact-sheet.png
          test -s out/p3.2/reference/p2-p3-1-p3-2-comparison.png
          test -s out/p3.2/reference/p3-2-typography-strip.png
          test -s out/p3.2/reference/p3-2-continuity-strip.png
          test -s out/p3.2/reference/p3-2-depth-camera-strip.png
          test -s out/p3.2/reference/visual-plan.json
          test -s out/p3.2/reference/visual-preflight.json
          test -s out/p3.2/reference/visual-diversity-report.json
          test -s out/p3.2/reference/metrics.json
          test -s out/p3.2/reference/manifest.json
          test -s out/p3.2/reference/artifact-integrity.json

      - name: Upload P3.2 human review package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p3.2-premium-motion-vocabulary-${{ github.sha }}
          path: |
            out/p3.1/reference/
            out/p3.1/certification/
            out/p1.7/reference/
            out/p1.7/certification/
            out/p3.2/reference/
            out/p3.2/certification/
          if-no-files-found: error
          retention-days: 30
