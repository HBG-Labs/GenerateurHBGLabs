name: Motion Engine Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  motion-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Contamination tests
        run: npm run test:contamination

      - name: Core isolation tests
        run: npm run test:isolation

      - name: P1.6 semantic golden and certification
        run: |
          npm run golden:verify:p1.6
          npm run test:p1.6
